<svg xmlns="http://www.w3.org/2000/svg" width="688" height="154" viewBox="0 0 688 154" role="img"><title>Reviewed provisioning and custody</title><desc>Conceptual workflow diagram; not a device screenshot or acceptance evidence.</desc><g font-family="DejaVu Sans,sans-serif" fill="#17222d"><text x="16" y="29" font-size="16" font-weight="bold">Reviewed provisioning and custody</text><rect x="16" y="58" width="208" height="76" rx="8" fill="#eef5f7" stroke="#2f6375"/><text x="120" y="88" text-anchor="middle" font-size="12" font-weight="bold">Identify + lock policy</text><text x="120" y="111" text-anchor="middle" font-size="10">Exact physical asset</text><path d="M227 96h10m-4-4 4 4-4 4" fill="none" stroke="#2f6375"/><rect x="240" y="58" width="208" height="76" rx="8" fill="#eef5f7" stroke="#2f6375"/><text x="344" y="88" text-anchor="middle" font-size="12" font-weight="bold">Review + execute</text><text x="344" y="111" text-anchor="middle" font-size="10">Owned recovery</text><path d="M451 96h10m-4-4 4 4-4 4" fill="none" stroke="#2f6375"/><rect x="464" y="58" width="208" height="76" rx="8" fill="#eef5f7" stroke="#2f6375"/><text x="568" y="88" text-anchor="middle" font-size="12" font-weight="bold">Measure + hand off</text><text x="568" y="111" text-anchor="middle" font-size="10">Recipient accepts</text></g></svg>
