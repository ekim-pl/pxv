[package]
name = "pxv-supervisor"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
