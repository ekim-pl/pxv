name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      PXV_REQUIRE_CRYPTO: '1'
      PXV_QUALITY_TOOLS: ${{ runner.temp }}/pxv-quality-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact Node and pnpm
        shell: bash
        run: |
          curl --fail --silent --show-error --output "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz
          echo "cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.22.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install workspace and native toolchain
        run: |
          npm install --global pnpm@12.11.2
          pnpm install --frozen-lockfile
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl --component clippy --component rustfmt
          rustup default 1.99.1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          pnpm quality:setup
      - name: Strict quality, native faults, genuine crypto and all helpers
        run: |
          pnpm build:native
          pnpm quality
      - name: Native host baseline
        run: |
          node tools/check-native-baseline.mjs
      - name: Build local distributions without publication
        shell: bash
        run: |
          pxv_formats=portable,oci
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            pxv_formats=portable,deb,npm,oci
          fi
          node packages/release/dist/cli.js --formats "$pxv_formats" --output-root "$RUNNER_TEMP/pxv-preview" > "$RUNNER_TEMP/pxv-preview-result.json"
      - name: Execute a native lease and durable receipt on Debian12
        shell: bash
        run: |
          pxv_baseline_image=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).artifacts.find(a=>a.format==="oci").image' "$RUNNER_TEMP/pxv-preview-result.json")
          docker run --rm --read-only --user 1000:1000 --cap-drop ALL --network none \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$PWD/tools/check-native-baseline.mjs,dst=/workspace/tools/check-native-baseline.mjs,readonly" \
            --mount "type=bind,src=$PWD/packages/runtime/dist,dst=/workspace/packages/runtime/dist,readonly" \
            --entrypoint /opt/pxv/bin/node "$pxv_baseline_image" /workspace/tools/check-native-baseline.mjs
      - name: Whitespace
        run: git diff --check
      - name: Retain component quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxv-component-quality
          if-no-files-found: warn
          path: |
            .quality/report.json
            .quality/report.md
            .quality/metrics.json
            .quality/coverage.json
            .quality/deadcode.json
            .quality/helpers.json
