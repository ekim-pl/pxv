name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      PXV_REQUIRE_CRYPTO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure quality tool directory
        run: echo "PXV_QUALITY_TOOLS=$RUNNER_TEMP/pxv-quality-tools" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact Node and pnpm
        shell: bash
        run: |
          curl --fail --silent --show-error --output "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz
          echo "cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.22.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install workspace and helper toolchain
        run: |
          npm install --global pnpm@12.11.2
          pnpm install --frozen-lockfile
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          pnpm quality:setup
      - name: Install and preflight real PDF regression dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils fonts-dejavu-core fonts-liberation
          pnpm --filter @pxv/release exec playwright install --with-deps chromium
          pxv_chromium="$(pnpm --filter @pxv/release exec node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$pxv_chromium"
          "$pxv_chromium" --version
          pnpm --filter @pxv/release exec node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ executablePath: process.argv[1], headless: true }); await browser.close();' "$pxv_chromium"
          for pxv_poppler in pdfinfo pdftotext pdftoppm pdftohtml; do
            command -v "$pxv_poppler"
            "$pxv_poppler" -v
          done
          test -d "$ANDROID_HOME"
          test -x "$JAVA_HOME/bin/java"
          # Ubuntu 24.04 restricts user namespaces for the downloaded Chromium binary.
          # Playwright disables its sandbox; direct PDF tests need the same CI-only setup.
          pxv_test_chromium="$RUNNER_TEMP/pxv-test-chromium"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$pxv_chromium" > "$pxv_test_chromium"
          chmod 700 "$pxv_test_chromium"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$pxv_test_chromium" --headless --disable-gpu --dump-dom about:blank
          echo "PXV_CHROMIUM=$pxv_test_chromium" >> "$GITHUB_ENV"
          echo "PXV_ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PXV_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Audit frozen dependencies against current advisories
        run: |
          mkdir -p .quality
          pnpm audit --json > .quality/advisories.json
      - name: Strict quality, supervisor faults, genuine crypto and all helpers
        run: |
          pnpm build
          pnpm quality
      - name: Native host baseline
        run: |
          node tools/check-native-baseline.mjs
      - name: Build local distributions without publication
        shell: bash
        run: |
          pxv_formats=portable,oci
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* ]]; then
            pxv_formats=portable,deb,npm,oci
          fi
          node packages/release/dist/cli.js --formats "$pxv_formats" --output-root "$RUNNER_TEMP/pxv-preview" > "$RUNNER_TEMP/pxv-preview-result.json"
      - name: Execute each packaged runtime on Debian 12 and Ubuntu 24.04
        run: node tools/check-packaged-runtime.mjs "$RUNNER_TEMP/pxv-preview-result.json"
      - name: Disposable Docker worker paths and supplementary groups
        run: node tools/check-docker-worker.mjs --build-result "$RUNNER_TEMP/pxv-preview-result.json"
      - name: Whitespace
        run: git diff --check
      - name: Retain component quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxv-component-quality
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .quality/report.json
            .quality/report.md
            .quality/metrics.json
            .quality/coverage.json
            .quality/deadcode.json
            .quality/helpers.json
            .quality/tests.json
            .quality/dependencies.json
            .quality/advisories.json
            .quality/docker-worker.json
            .quality/packaged-runtime.json
            ${{ runner.temp }}/pxv-preview-result.json
            ${{ runner.temp }}/pxv-preview/*/artifacts/provenance.json
            ${{ runner.temp }}/pxv-preview/*/artifacts/SHA256SUMS
